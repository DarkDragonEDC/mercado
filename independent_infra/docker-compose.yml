services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ALBIONMKT_DATABASE_PATH: /srv/albionmkt/data/licenses.db
    volumes:
      - albionmkt_data:/srv/albionmkt/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  discord-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ALBIONMKT_BACKEND_URL: http://backend:8000
    command: ["python", "-m", "bot.discord_bot"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  albionmkt_data:
